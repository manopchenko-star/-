<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Школьный ящик идей</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--primary:#4f46e5;--text:#1e1b2e;--muted:#6b7280;--border:#e5e7f0;--gdz:#8b5cf6;--shadow:0 12px 34px rgba(79,70,229,.10)}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6fb;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
  .bg-blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:-1}
  .blob1{width:420px;height:420px;background:#c7d2fe;top:-140px;left:-130px}
  .blob2{width:380px;height:380px;background:#ddd6fe;bottom:-150px;right:-110px}
  .wrap{width:100%;max-width:680px;margin:0 auto;padding:0 20px 30px}
  header{padding:24px 0 6px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px}
  .logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
  
  .banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.5;margin-top:15px;display:none}

  .segmented{position:relative;display:flex;background:#eef0f8;border-radius:14px;padding:5px;margin-top:16px;transition:.3s}
  .segmented.single button{width:100%;flex:none}
  .segmented button{flex:1;position:relative;z-index:2;border:none;background:transparent;padding:10px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer;transition:.22s;font-family:inherit}
  .segmented button.active{color:#fff}
  .seg-indicator{position:absolute;z-index:1;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);border-radius:10px;background:linear-gradient(135deg,#6366f1,#4f46e5);transition:.3s;box-shadow:0 4px 12px rgba(79,70,229,.3)}
  .segmented.gdz .seg-indicator{transform:translateX(100%);background:linear-gradient(135deg,var(--gdz),#7c3aed);box-shadow:0 4px 12px rgba(139,92,246,.3)}
  
  .card{background:#fff;border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px;margin-top:20px;animation:pop .3s ease}
  h1{font-size:24px;margin-bottom:9px;letter-spacing:-.03em}
  .lead{color:var(--muted);font-size:14.5px;margin-bottom:22px;line-height:1.5}
  
  .field{margin-bottom:16px}
  label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:7px}
  input,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:13px;font-size:14.5px;outline:none;transition:.2s;font-family:inherit;background:#fff}
  input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.13)}
  textarea{resize:vertical;min-height:128px;line-height:1.5}
  
  .btn{border:none;border-radius:13px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;width:100%;font-family:inherit;transition:.2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(79,70,229,.3)}
  .btn:active{transform:translateY(0)}
  
  .sub-tabs{display:flex;gap:8px;margin-bottom:16px;background:#f4f6fb;padding:5px;border-radius:12px}
  .sub-tabs button{flex:1;border:none;background:transparent;padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:.2s}
  .sub-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.05)}

  .idea{background:#fbfbff;border:1px solid var(--border);border-radius:16px;padding:17px 18px;margin-bottom:12px;animation:fadeIn .3s ease}
  .idea-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
  .idea-title{font-weight:800;font-size:15px;line-height:1.3}
  .idea-text{color:#3f3d56;font-size:14px;white-space:pre-wrap;line-height:1.5}
  .idea-meta{font-size:12px;color:var(--muted);margin-top:12px;font-weight:600}
  
  .badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.pending{background:#fef3c7;color:#b45309}
  .badge.approved{background:#d1fae5;color:#047857}
  .badge.rejected{background:#fee2e2;color:#b91c1c}
  .comment{background:#f8f9ff;border-left:3px solid var(--primary);padding:11px 15px;border-radius:9px;font-size:13px;margin-top:13px;color:#3f3d56;line-height:1.55;white-space:pre-wrap}
  .comment b{color:var(--primary)}
  
  .chat{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow-y:auto;padding-bottom:12px;scroll-behavior:smooth}
  .msg{display:flex;gap:10px;max-width:93%;animation:fadeIn .3s ease}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg .ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .msg.bot .ava{background:var(--gdz);color:#fff}
  .msg.me .ava{background:#818cf8;color:#fff}
  .msg .bubble{padding:11px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.5;word-break:break-word}
  .msg.me .bubble{background:#4f46e5;color:#fff;border-bottom-right-radius:4px}
  .msg.bot .bubble{background:#f1f5f9;border:1px solid #e5e7f0;border-bottom-left-radius:4px}
  .ans-note{font-size:11.5px;font-weight:800;margin-top:9px;color:#047857;display:flex;align-items:center;gap:4px}
  
  .typing{display:flex;gap:4px;padding:4px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:bounce 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  
  .composer{display:flex;gap:8px;align-items:center;background:#f4f6fb;border:1.5px solid var(--border);border-radius:16px;padding:7px 8px;margin-top:14px;transition:.2s}
  .composer:focus-within{border-color:var(--gdz);box-shadow:0 0 0 4px rgba(139,92,246,.13);background:#fff}
  .composer input{flex:1;border:none;background:transparent;padding:9px;outline:none;box-shadow:none;font-size:14.5px}
  .composer input:focus{box-shadow:none}
  .composer button{width:44px;height:40px;border-radius:12px;border:none;background:var(--gdz);color:#fff;cursor:pointer;font-size:16px;transition:.2s}
  .composer button:hover{background:#7c3aed}
  
  .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 14px; background: #f8fafc; border-radius: 15px; border: 1px dashed var(--border); }
  .locked-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .locked-state .em { font-size: 50px; margin-bottom: 15px; }
  .hide{display:none !important}
  
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
</style>
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">📬</div><div>Школьный ящик идей</div></div>
    <div class="banner" id="notice-banner"></div>
    
    <div class="segmented" id="seg">
      <span class="seg-indicator" id="seg-ind"></span>
      <button data-tab="ideas" id="tab-ideas" class="active">💡 Идеи</button>
      <button data-tab="gdz" id="tab-gdz">🧠 Нейро-ГДЗ</button>
    </div>
  </header>
  
  <main>
    <div id="locked-view" class="locked-state hide">
      <div class="em">🔒</div>
      <h2>Доступ временно закрыт</h2>
      <p style="margin-top:10px">Администрация отключила все разделы. Загляни позже.</p>
    </div>

    <div class="card name-card" id="name-card" style="padding:16px 20px">
      <div style="display:flex;gap:13px;align-items:center">
        <div style="font-size:24px">👤</div>
        <div style="flex:1">
          <div style="font-size:13.5px;font-weight:800;margin-bottom:6px">Как тебя зовут? <span style="color:#aab0c4;font-weight:600" id="name-req">(необязательно)</span></div>
          <input id="name-input" placeholder="Имя и фамилия" style="padding:10px 12px">
        </div>
        <button class="btn" style="width:auto;padding:10px 16px" id="name-save">ОК</button>
      </div>
    </div>

    <section id="panel-ideas" class="hide">
      <div class="card">
        <h1>Предложи идею 💡</h1>
        <p class="lead">Что можно улучшить в школе? Напиши, и администрация обязательно прочитает.</p>
        <form id="idea-form">
          <div class="field"><textarea id="idea-text" required placeholder="Например: хочется больше растений в коридорах, чтобы было уютнее..."></textarea></div>
          <button class="btn" type="submit">Отправить идею</button>
        </form>
      </div>
      
      <div class="card" id="ideas-list-wrapper">
        <h2 style="font-size:17px;margin-bottom:15px;letter-spacing:-.02em">💬 Идеи</h2>
        
        <div class="sub-tabs" id="ideas-subtabs">
          <button id="btn-all-ideas" class="active" onclick="setIdeasFilter('all')">Все идеи</button>
          <button id="btn-my-ideas" onclick="setIdeasFilter('my')">Мои идеи</button>
        </div>

        <div id="ideas-list"></div>
      </div>
    </section>

    <section id="panel-gdz" class="hide">
      <div class="card">
        <div style="display:flex;gap:13px;align-items:center;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)">
          <div style="width:46px;height:46px;border-radius:14px;background:var(--gdz);color:#fff;display:grid;place-items:center;font-size:21px">🧠</div>
          <div>
            <div style="font-weight:800;font-size:16px" id="bot-title">Нейро-ГДЗ</div>
            <div style="font-size:12.5px;color:var(--muted)">Решает задания по тексту · ответ проверяет учитель</div>
          </div>
        </div>
        <div class="chat" id="chat"></div>
        <div class="composer">
          <input id="gdz-text" placeholder="Напиши задание сюда...">
          <button id="gdz-send">➤</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
let currentTab = 'ideas', ideasFilter = 'all', myName = localStorage.getItem('name') || '', data = { ideas: [], gdz: [], settings: {} };
let isBotTyping = false;
const $ = s => document.querySelector(s);
function esc(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(ts) { return new Date(ts).toLocaleString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }

function updateNameUI() {
  if (myName) {
    $('#name-card').classList.add('hide');
  } else {
    $('#name-card').classList.remove('hide');
  }
}

function applySettings(s) {
  if (!s) return;
  
  if (s.notice) {
    $('#notice-banner').textContent = s.notice;
    $('#notice-banner').style.display = 'block';
  } else {
    $('#notice-banner').style.display = 'none';
  }

  $('#bot-title').textContent = s.botTitle || 'Нейро-ГДЗ';

  if (s.requireName) {
    $('#name-req').textContent = '(обязательно)';
    $('#name-req').style.color = '#ef4444';
  } else {
    $('#name-req').textContent = '(необязательно)';
    $('#name-req').style.color = '#aab0c4';
  }

  const gdzOn = s.gdzEnabled !== false;
  const ideasOn = s.ideasEnabled !== false;
  
  $('#tab-ideas').classList.toggle('hide', !ideasOn);
  $('#tab-gdz').classList.toggle('hide', !gdzOn);

  if (ideasOn && !gdzOn) {
    $('#seg').classList.add('single'); $('#seg-ind').style.width = 'calc(100% - 10px)'; switchTab('ideas');
  } else if (!ideasOn && gdzOn) {
    $('#seg').classList.add('single'); $('#seg-ind').style.width = 'calc(100% - 10px)'; switchTab('gdz');
  } else if (!ideasOn && !gdzOn) {
    $('#seg').classList.add('hide'); $('.name-card').classList.add('hide');
    $('#locked-view').classList.remove('hide'); $('#panel-ideas').classList.add('hide'); $('#panel-gdz').classList.add('hide');
  } else {
    $('#seg').classList.remove('single'); $('#seg-ind').style.width = 'calc(50% - 5px)'; switchTab(currentTab);
  }

  $('#ideas-list-wrapper').classList.toggle('hide', s.showIdeasList === false);

  if (s.maxText) {
    $('#idea-text').setAttribute('maxlength', s.maxText);
    $('#gdz-text').setAttribute('maxlength', s.maxText);
  }
}

function switchTab(tab) {
  currentTab = tab;
  if(tab === 'ideas') {
    $('#seg').classList.remove('gdz');
    $('#tab-ideas').classList.add('active');
    $('#tab-gdz').classList.remove('active');
    $('#panel-ideas').classList.remove('hide');
    $('#panel-gdz').classList.add('hide');
  } else {
    $('#seg').classList.add('gdz');
    $('#tab-gdz').classList.add('active');
    $('#tab-ideas').classList.remove('active');
    $('#panel-gdz').classList.remove('hide');
    $('#panel-ideas').classList.add('hide');
    setTimeout(() => { $('#chat').scrollTop = $('#chat').scrollHeight; }, 50);
  }
}

function setIdeasFilter(filter) {
  ideasFilter = filter;
  $('#btn-all-ideas').classList.toggle('active', filter === 'all');
  $('#btn-my-ideas').classList.toggle('active', filter === 'my');
  renderIdeas();
}

function renderIdeas() {
  let list = data.ideas || [];
  
  if (ideasFilter === 'my') {
    if (!myName) {
      $('#ideas-list').innerHTML = '<div class="empty-state">Пожалуйста, укажи свое имя наверху, чтобы мы могли показать твои идеи и ответы на них.</div>';
      return;
    }
    list = list.filter(i => i.author === myName);
  }

  if (list.length === 0) {
    $('#ideas-list').innerHTML = `<div class="empty-state">${ideasFilter === 'my' ? 'Ты пока не предлагал идей.' : 'Пока идей нет. Стань первым!'}</div>`;
    return;
  }

  $('#ideas-list').innerHTML = list.map(i => {
    let badge = '<span class="badge pending">На рассмотрении</span>';
    if (i.status === 'approved') badge = '<span class="badge approved">Принято</span>';
    if (i.status === 'rejected') badge = '<span class="badge rejected">Отклонено</span>';

    let commentHtml = '';
    if (ideasFilter === 'my' && i.comment) {
      commentHtml = `<div class="comment"><b>Ответ администрации:</b><br>${esc(i.comment)}</div>`;
    }

    return `
    <div class="idea">
      <div class="idea-head">
        <div class="idea-title">${esc(i.text.split('\\n')[0].slice(0, 80))}</div>
        ${badge}
      </div>
      <div class="idea-text">${esc(i.text)}</div>
      <div class="idea-meta">👤 ${esc(i.author)} · 🕒 ${fmt(i.createdAt)}</div>
      ${commentHtml}
    </div>
    `;
  }).join('');
}

function renderChat() {
  let html = `<div class="msg bot"><div class="ava">🧠</div><div class="bubble">Привет! Я ${esc(data.settings?.botTitle || 'Нейро-ГДЗ')}. Пришли мне задание текстом, и я постараюсь его решить.</div></div>`;
  
  if (data.gdz && data.gdz.length > 0) {
    data.gdz.forEach(r => {
      html += `<div class="msg me"><div class="ava">${esc((r.author || 'Я').charAt(0).toUpperCase())}</div><div class="bubble">${esc(r.question)}</div></div>`;
      const checked = r.adminAnswer && r.adminAnswer.trim();
      const ans = checked ? r.adminAnswer : (r.botAnswer || 'Думаю...');
      const note = checked ? '<div class="ans-note">✓ Проверено учителем</div>' : '';
      html += `<div class="msg bot"><div class="ava">🧠</div><div class="bubble">${esc(ans)}${note}</div></div>`;
    });
  }

  if (isBotTyping) {
    html += `<div class="msg bot"><div class="ava">🧠</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  }

  $('#chat').innerHTML = html;
  $('#chat').scrollTop = $('#chat').scrollHeight;
}

async function fetchData() {
  try {
    const res = await fetch('/api/state');
    data = await res.json();
    if (data.settings) applySettings(data.settings);
    renderIdeas();
    renderChat();
  } catch(e) { console.error('Ошибка загрузки данных', e); }
}

$('#name-save').onclick = () => {
  const v = $('#name-input').value.trim();
  if(v.length < 2 && data.settings?.requireName) return alert('Администрация требует указать имя!');
  if(v.length > 0) { myName = v; localStorage.setItem('name', v); }
  updateNameUI();
  renderIdeas();
};

$('#tab-ideas').onclick = () => switchTab('ideas');
$('#tab-gdz').onclick = () => switchTab('gdz');

$('#idea-form').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('#idea-text').value.trim();
  if(!text) return;
  if(data.settings?.requireName && !myName) return alert('Сначала укажи имя!');
  
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Отправка...';
  
  await fetch('/api/idea', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ text, author: myName || 'Аноним' }) });
  
  $('#idea-text').value = '';
  btn.disabled = false; btn.textContent = 'Отправить идею';
  
  setIdeasFilter('my');
  fetchData();
};

$('#gdz-send').onclick = async () => {
  const text = $('#gdz-text').value.trim();
  if(!text) return;
  if(data.settings?.requireName && !myName) return alert('Сначала укажи имя!');
  
  $('#gdz-text').value = '';
  isBotTyping = true;
  renderChat();
  
  await fetch('/api/gdz', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ question: text, author: myName || 'Аноним' }) });
  
  isBotTyping = false;
  fetchData();
};

$('#gdz-text').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') $('#gdz-send').click();
});

updateNameUI();
fetchData();
setInterval(fetchData, 5000);
</script>
</body>
</html>
